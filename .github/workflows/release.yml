name: release

on:
    release:
        types: [released]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: 'cubetiq/nextimg-server'

jobs:
    amd64:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN  }}
            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}-amd64
                      type=raw,value=latest-amd64
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
    arm64:
        runs-on:
            group: arm-runners
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN  }}
            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}-arm64
                      type=raw,value=latest-arm64
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/arm64/v8
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
    merge-manifest:
        runs-on: ubuntu-latest
        needs: [amd64, arm64]
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN  }}
            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
            - name: Create & publish manifest
              run: |
                  # Get the version tag without architecture suffix
                  VERSION_TAG=${{ fromJSON(steps.meta.outputs.json).tags[0] }}

                  # Create multi-arch manifest for version tag
                  docker buildx imagetools create \
                    --tag ${VERSION_TAG} \
                    ${VERSION_TAG}-amd64 \
                    ${VERSION_TAG}-arm64

                  # Create multi-arch manifest for latest tag
                  docker buildx imagetools create \
                    --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64
